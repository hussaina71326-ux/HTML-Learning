<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>

  <body>
    <!-- name, phone, email, password, polling(yes/no), file upload, buttons-->
    <form>
      <!-- <label for="">UserName</label> -->
      <input type="text" placeholder="Enter Your Name" required /> <br />
      <input type="email" placeholder="Add Email" required /> <br />
      <input type="password" placeholder="Enter Password" /> <br />
      <br />

      <label for="course">Choose Course</label> <br />

      <input type="radio" value="ds" name="course" id="" />
      <label for="">Data Science</label> <br />

      <input type="radio" value="ml" name="course" id="" />
      <label for="">Machine Learning</label> <br />

      <input type="radio" value="wd" name="course" id="" />
      <label for="">Web development</label> <br />
      <br />
      <hr />
      <hr />
      <label for="">Choose Subjects</label> <br />
      <input type="checkbox" name="" id="" />
      <label for="">HTML</label><br />
      <input type="checkbox" name="" id="" />
      <label for="">CSS</label><br />
      <input type="checkbox" name="" id="" />
      <label for="">JS</label><br />
      <input type="checkbox" name="" id="" />
      <label for="">Python</label><br />
      <input type="checkbox" name="" id="" />
      <label for="">statestics</label><br />
      <input type="checkbox" name="" id="" />
      <label for="">PowerBi</label><br />
      <br />

      <!-- Dropdown -->
      <label for="">Projects</label>
      <select name="" id="">
        <optgroup label="Web Dev">
          <option value="">E-Commerce</option>
          <option value="">Portfolio project</option>
          <option value="">Clone Projects</option>
        </optgroup>
        <optgroup label="Data Science">
          <option value="">Ai Chotbot</option>
          <option value="">Image glance</option>
          <option value="">Object detection</option>
        </optgroup>
      </select>

      <br />
      <br />
      <textarea name="" id=""></textarea> <br />
      <br />
      <input type="datetime-local" name="" id="" /> <br />
      <br />
      <input type="color" name="" id="" /> <br />
      <br />
      <input type="file" name="" id="" /> <br />
      <br />

      <br />
      <br /><button type="submit">Submit</button>
    </form>

    <div>
      <video
        src="../Images/t.mp4"
        height="500px"
        width="100%"
        loop
        controls
      ></video>
      <audio src=""></audio>
    </div>
    <div class="map">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d248857.20068540564!2d77.60773119999999!3d12.946636799999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1762874058881!5m2!1sen!2sin"
        width="800"
        height="600"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
  </body>
</html>
